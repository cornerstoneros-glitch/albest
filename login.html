<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | Albest Communication</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1a8f78;
            --primary-dark: #0d4f43;
            --bg: #f4f6f8;
            --white: #ffffff;
            --text: #111827;
            --text-light: #6b7280;
            --border: #e5e7eb;
            --radius: 12px;
            --shadow: 0 4px 24px rgba(0,0,0,0.10);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0d4f43 0%, #1a8f78 50%, #0a3d32 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .login-card {
            background: var(--white);
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
        }
        .login-header {
            background: linear-gradient(135deg, #1a8f78, #0d4f43);
            padding: 2.5rem;
            text-align: center;
            color: white;
        }
        .login-header img { height: 56px; width: auto; background: white; padding: 8px 16px; border-radius: 10px; margin-bottom: 1rem; }
        .login-header h1 { font-size: 1.4rem; font-weight: 700; }
        .login-header p { font-size: 0.85rem; opacity: 0.8; margin-top: 0.3rem; }
        .login-body { padding: 2.5rem; }
        .tabs { display: flex; margin-bottom: 2rem; border-radius: 10px; background: var(--bg); padding: 4px; }
        .tab-btn {
            flex: 1; padding: 0.7rem; border: none; background: transparent; cursor: pointer;
            border-radius: 8px; font-weight: 600; font-size: 0.9rem; color: var(--text-light); transition: all 0.2s;
        }
        .tab-btn.active { background: var(--white); color: var(--primary); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .form-panel { display: none; }
        .form-panel.active { display: block; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text); margin-bottom: 0.4rem; }
        .form-group input {
            width: 100%; padding: 0.8rem 1rem;
            border: 1.5px solid var(--border); border-radius: 10px;
            font-size: 0.95rem; font-family: inherit; color: var(--text);
            transition: border-color 0.2s; outline: none;
        }
        .form-group input:focus { border-color: var(--primary); }
        .btn-submit {
            width: 100%; padding: 1rem; background: var(--primary);
            color: white; border: none; border-radius: 10px;
            font-size: 1rem; font-weight: 700; cursor: pointer;
            transition: background 0.2s; margin-top: 0.5rem;
        }
        .btn-submit:hover { background: var(--primary-dark); }
        .error-msg { background: #fef2f2; color: #dc2626; padding: 0.8rem 1rem; border-radius: 8px; font-size: 0.9rem; margin-bottom: 1rem; display: none; }
        .back-link { display: block; text-align: center; margin-top: 1.5rem; color: var(--text-light); font-size: 0.85rem; text-decoration: none; }
        .back-link:hover { color: var(--primary); }
    </style>
</head>
<body>
<div class="login-card">
    <div class="login-header">
        <img src="/logo.jpg" alt="Albest Communication">
        <h1>Espace Albest</h1>
        <p>Connectez-vous pour accéder à votre espace</p>
    </div>
    <div class="login-body">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('login')">Connexion</button>
            <button class="tab-btn" onclick="switchTab('register')">Créer un compte</button>
        </div>

        <div id="panel-login" class="form-panel active">
            <div class="error-msg" id="login-error"></div>
            <div class="form-group">
                <label>Adresse email</label>
                <input type="email" id="login-email" placeholder="votre@email.com">
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" id="login-password" placeholder="••••••••">
            </div>
            <button class="btn-submit" onclick="handleLogin()">Se connecter</button>
        </div>

        <div id="panel-register" class="form-panel">
            <div class="error-msg" id="register-error"></div>
            <div class="form-group">
                <label>Nom complet *</label>
                <input type="text" id="reg-name" placeholder="Jean Dupont">
            </div>
            <div class="form-group">
                <label>Email *</label>
                <input type="email" id="reg-email" placeholder="votre@email.com">
            </div>
            <div class="form-group">
                <label>Entreprise</label>
                <input type="text" id="reg-company" placeholder="Ma Société">
            </div>
            <div class="form-group">
                <label>Téléphone</label>
                <input type="tel" id="reg-phone" placeholder="+225 05 44 05 48 48">
            </div>
            <div class="form-group">
                <label>Mot de passe *</label>
                <input type="password" id="reg-password" placeholder="Minimum 6 caractères">
            </div>
            <button class="btn-submit" onclick="handleRegister()">Créer mon compte</button>
        </div>

        <a href="/" class="back-link">← Retour au site</a>
    </div>
</div>

<script>
function switchTab(tab) {
    document.getElementById('panel-login').classList.toggle('active', tab === 'login');
    document.getElementById('panel-register').classList.toggle('active', tab === 'register');
    document.querySelectorAll('.tab-btn').forEach((btn, i) => btn.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'register')));
}

async function handleLogin() {
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    const errEl = document.getElementById('login-error');
    errEl.style.display = 'none';
    try {
        const res = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
        const data = await res.json();
        if (!res.ok) { errEl.textContent = data.error; errEl.style.display = 'block'; return; }
        window.location.href = data.user.role === 'ADMIN' ? '/dashboard-admin' : '/dashboard-client';
    } catch (e) { errEl.textContent = 'Erreur de connexion'; errEl.style.display = 'block'; }
}

async function handleRegister() {
    const name = document.getElementById('reg-name').value;
    const email = document.getElementById('reg-email').value;
    const company = document.getElementById('reg-company').value;
    const phone = document.getElementById('reg-phone').value;
    const password = document.getElementById('reg-password').value;
    const errEl = document.getElementById('register-error');
    errEl.style.display = 'none';
    try {
        const res = await fetch('/api/auth/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, email, company, phone, password }) });
        const data = await res.json();
        if (!res.ok) { errEl.textContent = data.error; errEl.style.display = 'block'; return; }
        window.location.href = '/dashboard-client';
    } catch (e) { errEl.textContent = 'Erreur lors de la création'; errEl.style.display = 'block'; }
}

document.addEventListener('keydown', (e) => { if (e.key === 'Enter') { const active = document.querySelector('.form-panel.active'); active.id === 'panel-login' ? handleLogin() : handleRegister(); } });
</script>
</body>
</html>
